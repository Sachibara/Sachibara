name: sachibara-engineering
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U operations -d operations]
      interval: 5s
      retries: 10
  api:
    build:
      context: ../node-operations-platform
      dockerfile: ../delivery-cloud-lab/docker/api.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 5081
      DATABASE_URL: ${DATABASE_URL:?Set postgresql://operations:URL_ENCODED_PASSWORD@db:5432/operations}
      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set an initial admin password of 12+ characters}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5081/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: delivery-cloud-lab/docker/web.Dockerfile
    ports: ["127.0.0.1:8085:8080"]
    depends_on: [api]
  ops:
    build:
      context: ../python-ops-studio
      dockerfile: ../delivery-cloud-lab/docker/ops.Dockerfile
    environment:
      OPS_TOKEN: ${OPS_TOKEN:?Set a random operator token of 32+ characters}
      OPS_MONITOR_TARGETS: '{"Operations API":"http://api:5081/api/health","Ops Studio":"http://127.0.0.1:8090/api/health"}'
    ports: ["127.0.0.1:8090:8090"]
    volumes: [ops-data:/app/data]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    volumes: [./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set a Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [./observability/provisioning:/etc/grafana/provisioning:ro, ./observability/dashboards:/var/lib/grafana/dashboards:ro, grafana-data:/var/lib/grafana]
    ports: ["127.0.0.1:3001:3000"]
volumes:
  postgres-data:
  ops-data:
  prometheus-data:
  grafana-data:
