apiVersion: v1
kind: Namespace
metadata: {name: sachibara-lab}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: sachibara-lab}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: operations}
            - {name: POSTGRES_USER, value: operations}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: operations-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {exec: {command: [pg_isready, -U, operations, -d, operations]}, initialDelaySeconds: 5}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: sachibara-lab}
spec: {clusterIP: None, selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: sachibara-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: sachibara-operations-api:local
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: operations-secrets}}]
          env: [{name: HOST, value: '0.0.0.0'}, {name: PORT, value: '5081'}]
          ports: [{containerPort: 5081}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {httpGet: {path: /api/health, port: 5081}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 5081}, initialDelaySeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: sachibara-lab}
spec: {selector: {app: api}, ports: [{port: 5081}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: sachibara-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: sachibara-operations-web:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: sachibara-lab}
spec: {selector: {app: web}, ports: [{port: 8080}]}
