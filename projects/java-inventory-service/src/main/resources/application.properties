server.address=127.0.0.1
server.port=8084
spring.datasource.url=${INVENTORY_DB_URL:jdbc:h2:file:./data/inventory}
spring.datasource.username=${INVENTORY_DB_USER:sa}
spring.datasource.password=${INVENTORY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
inventory.admin-password=${INVENTORY_ADMIN_PASSWORD}
