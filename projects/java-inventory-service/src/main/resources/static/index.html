<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Ledger</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="eyebrow">Sachibara / Java + Spring Boot</span><h1>Stock Ledger</h1><p class="muted">Inventory balances with transactional movement history.</p></div></header><p id="error" class="error" role="alert" hidden></p><form id="login" class="inline"><label>Administrator password<br><input id="password" type="password" required minlength="12"></label><button>Connect</button></form><form id="create" class="inline"><label>SKU<br><input id="sku" required maxlength="40"></label><label>Product name<br><input id="name" required maxlength="120"></label><button>Create product</button></form><section class="panel"><h2>Products</h2><div id="products">Connect to load inventory.</div></section><section class="panel"><h2>Recent movements</h2><div id="movements">Select a product's history.</div></section><footer>Stock changes require a reason and reject stale versions. Maximum 500 products displayed.</footer></main><script src="/app.js"></script></body></html>
